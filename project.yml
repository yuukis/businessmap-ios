name: BusinessMap
options:
  bundleIdPrefix: com.github.yuukis
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: "1"
targets:
  BusinessMap:
    type: application
    platform: iOS
    sources:
      - BusinessMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.yuukis.businessmap
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: BusinessMap/Info.plist
      properties:
        CFBundleDisplayName: Business Map
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSContactsUsageDescription: Business Map shows contacts that have postal addresses on the map.
        NSLocationWhenInUseUsageDescription: Your current location is shown on the map.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  BusinessMapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BusinessMapTests
    dependencies:
      - target: BusinessMap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BusinessMap.app/BusinessMap"
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_BUNDLE_IDENTIFIER: com.github.yuukis.businessmap.tests
schemes:
  BusinessMap:
    build:
      targets:
        BusinessMap: all
        BusinessMapTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BusinessMapTests
